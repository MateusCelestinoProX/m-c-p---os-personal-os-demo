<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>M.C.P PERSONAL OS — Autenticação Google</title>
    <style>
        body {
            background: #030305;
            color: #f5f5f7;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 1.5rem;
            padding: 2rem;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 { font-size: 1.25rem; font-weight: 700; margin: 0 0 0.5rem; }
        p { color: rgba(255, 255, 255, 0.7); font-size: 0.875rem; margin: 0 0 1.5rem; line-height: 1.5; }
        .btn {
            display: inline-block;
            background: #ffffff;
            color: #000000;
            font-weight: 700;
            font-size: 0.875rem;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
            margin: 0.25rem;
        }
        .btn-outline {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .token-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            padding: 0.5rem;
            font-family: monospace;
            font-size: 0.75rem;
            word-break: break-all;
            margin-bottom: 1rem;
            color: #4ade80;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner" id="spinner"></div>
        <h2 id="title">Conectando ao Google Agenda...</h2>
        <p id="desc">Validando autenticação e sincronizando com o Personal OS.</p>
        <div id="token-container" style="display:none;">
            <div class="token-box" id="token-text"></div>
            <button type="button" class="btn" onclick="copyToken()">Copiar Token</button>
            <a href="/calendar.html" class="btn btn-outline">Abrir Calendário</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jfxxmhthwoggffrvkflv.supabase.co';
        const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpmeHhtaHRod29nZ2ZmcnZrZmx2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MDUyOTEsImV4cCI6MjEwMzI4MTI5MX0.yBYGdnsV2i-QOXytEtNhRsTBez1AfA67q9ct-4-ZrEw';

        let receivedToken = '';

        function copyToken() {
            if (navigator.clipboard && receivedToken) {
                navigator.clipboard.writeText(receivedToken).then(() => {
                    alert('Token copiado para a área de transferência!');
                });
            }
        }

        (async function () {
            try {
                const hash = window.location.hash.substring(1);
                const params = new URLSearchParams(hash);
                const token = params.get('access_token');
                const expiresIn = parseInt(params.get('expires_in') || '3600', 10);
                const error = params.get('error');

                if (error) {
                    document.getElementById('spinner').style.display = 'none';
                    document.getElementById('title').textContent = 'Erro de Autenticação';
                    document.getElementById('desc').textContent = 'O Google recusou ou cancelou o acesso: ' + error;
                    if (window.opener) {
                        try { window.opener.postMessage({ type: 'GOOGLE_OAUTH_ERROR', error }, '*'); } catch(e){}
                        setTimeout(() => window.close(), 2500);
                    }
                    return;
                }

                if (token) {
                    receivedToken = token;
                    const expiresAt = Date.now() + (expiresIn * 1000);

                    // 1. Salva localmente
                    try {
                        const stored = JSON.parse(localStorage.getItem('mcp_control_google_cal_settings') || '{}');
                        stored.access_token = token;
                        stored.token_expires_at = expiresAt;
                        stored.last_synced_at = new Date().toISOString();
                        localStorage.setItem('mcp_control_google_cal_settings', JSON.stringify(stored));
                        localStorage.setItem('mcp_oauth_pending_sync', '1');
                    } catch (e) {}

                    // 2. Sincroniza em nuvem no Supabase para compartilhar com o APK Mobile
                    try {
                        const getRes = await fetch(SUPABASE_URL + '/rest/v1/control_email_settings?id=eq.default_settings&select=settings', {
                            headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON }
                        });
                        const data = await getRes.json();
                        const curSettings = (data && data[0] && data[0].settings) || {};
                        curSettings.google_calendar_settings = {
                            access_token: token,
                            token_expires_at: expiresAt,
                            last_synced_at: new Date().toISOString()
                        };

                        await fetch(SUPABASE_URL + '/rest/v1/control_email_settings?id=eq.default_settings', {
                            method: 'PATCH',
                            headers: {
                                'apikey': SUPABASE_ANON,
                                'Authorization': 'Bearer ' + SUPABASE_ANON,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ settings: curSettings })
                        });
                    } catch (supErr) {
                        console.warn('Erro ao sincronizar token com Supabase:', supErr);
                    }

                    // 3. Comunica com janela pai se existir (Popup Web Desktop)
                    if (window.opener) {
                        try {
                            window.opener.postMessage({
                                type: 'GOOGLE_OAUTH_SUCCESS',
                                access_token: token,
                                expires_in: expiresIn
                            }, '*');
                        } catch(e){}
                        document.getElementById('title').textContent = '✓ Google Conectado!';
                        document.getElementById('desc').textContent = 'Autenticado com sucesso. Fechando janela...';
                        setTimeout(() => window.close(), 1200);
                        return;
                    }

                    // 4. Sem janela pai (aberto no navegador do celular ou aba direta)
                    document.getElementById('spinner').style.display = 'none';
                    document.getElementById('title').textContent = '✓ Google Agenda Conectado!';
                    document.getElementById('desc').textContent = 'Sua conta Google foi sincronizada com a nuvem e com o Personal OS (Web & Mobile).';
                    
                    const tokenContainer = document.getElementById('token-container');
                    if (tokenContainer) {
                        tokenContainer.innerHTML = `
                            <div class="token-box" id="token-text">${token.substring(0, 28)}...</div>
                            <div style="display:flex; flex-direction:column; gap:0.5rem; max-width:320px; margin: 0 auto;">
                                <a href="mcp-personal-os://oauth#${hash}" class="btn" style="background: linear-gradient(135deg, #38bdf8, #2563eb); color: #fff; text-decoration: none;">📱 Voltar para o App Personal OS</a>
                                <button type="button" class="btn" onclick="copyToken()">Copiar Token</button>
                                <a href="/calendar.html" class="btn btn-outline" style="text-decoration: none;">Abrir Versão Web</a>
                            </div>
                        `;
                        tokenContainer.style.display = 'block';
                    }

                    // Tenta disparar o deep link automaticamente para reabrir o app nativo
                    try {
                        window.location.href = 'mcp-personal-os://oauth#' + hash;
                    } catch(de) {}

                    setTimeout(() => {
                        try { window.location.href = 'mcp-personal-os://oauth#' + hash; } catch(e){}
                    }, 1500);
                } else {
                    window.location.href = '/calendar.html';
                }
            } catch (err) {
                console.error('OAuth callback error:', err);
                window.location.href = '/calendar.html';
            }
        })();
    </script>
</body>
</html>
